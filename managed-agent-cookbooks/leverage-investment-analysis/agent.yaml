# Leverage Investment Analysis — managed-agent cookbook

name: leverage-investment-analysis
model: claude-opus-4-7

system:
  file: ../../plugins/agent-plugins/leverage-investment-analysis/agents/leverage-investment-analysis.md
  append: "You are running headless. Produce files in ./out/; do not assume an open Office document."

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read,  enabled: true }
      - { name: grep,  enabled: true }
      - { name: glob,  enabled: true }
  - { type: mcp_toolset, mcp_server_name: capiq, default_config: { enabled: true } }

mcp_servers:
  - { type: url, name: capiq, url: "${CAPIQ_MCP_URL}" }

skills:
  - { from_plugin: ../../plugins/agent-plugins/leverage-investment-analysis }

callable_agents:
  - { manifest: ./subagents/model-reader.yaml }
  - { manifest: ./subagents/scenario-runner.yaml }
  - { manifest: ./subagents/memo-writer.yaml }   # only leaf with Write
